# List-only Kubernetes access for the Neuralsec cloud scanner.
# Apply once per EKS cluster listed in eks_clusters. Order: upgrade the module,
# apply this manifest, then set eks_view_policy_association = false:
#   kubectl apply -f scanner-rbac-view.yaml
# While that input is true (the default) the AmazonEKSViewPolicy association
# stays; once it is false this ClusterRole is the whole grant. It allows only the verb list, across all namespaces, on the
# resources the scanner inventories: no get, no watch, no secrets, no configmaps,
# no pods/log, no wildcards. The group name must match kubernetes_groups on the
# aws_eks_access_entry created by this module.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: neuralsec-scanner-rbac-view
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["list"]
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["pods", "services", "serviceaccounts"]
    verbs: ["list"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["list"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "clusterroles", "rolebindings", "clusterrolebindings"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: neuralsec-scanner-rbac-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: neuralsec-scanner-rbac-view
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: neuralsec:scanner-rbac-view
